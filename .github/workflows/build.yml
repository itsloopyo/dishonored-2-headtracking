name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# The job reads the repository and publishes nothing, so it takes the read-only
# token rather than whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      # C++ toolchain for the pixi `package` task's cmake/msbuild build.
      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # The env is installed here (this workspace pulls cmake from conda-forge),
      # so the pixi tasks below get the same CMake a developer runs.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          # Fail on a lock/manifest mismatch rather than quietly re-solving the
          # environment on the runner: a CI build that resolves its own
          # dependencies is no longer the build a developer ran.
          locked: true

      # Build + test + package through the SAME command a developer runs
      # locally. All build logic lives in the pixi task chain (cmake configure ->
      # build -> test -> package); the workflow owns none, so local and CI can't
      # drift. There is no separate test step because `package` depends on
      # `test`: running one here as well would just run ctest twice, and the
      # release workflow reaches the suite through this same dependency rather
      # than through a step of its own.
      - name: Build, test and package
        shell: pwsh
        run: pixi run package

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*-installer.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            Write-Host "::error::No installer ZIP was produced by 'pixi run package'"
            exit 1
          }
